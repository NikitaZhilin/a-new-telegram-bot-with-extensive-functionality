# Docker Compose for local development and isolated VPS deployment.
#
# Services:
# - postgres: PostgreSQL database
# - init-db: one-shot schema initialization
# - bot: Telegram bot (single polling instance)
# - api: FastAPI admin API
# - worker: Reminder worker (single instance)
#
# Usage:
#   docker-compose up -d           # Start all services
#   docker-compose up -d bot       # Start only bot
#   docker-compose logs -f bot     # Follow bot logs
#   docker-compose down            # Stop all services

name: ${COMPOSE_PROJECT_NAME:-rememberme_bot}

services:
  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-rememberme_bot}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rememberme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rememberme-network

  # ===========================================================================
  # One-shot database initialization for first Docker start
  # ===========================================================================
  init-db:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-rememberme_bot-app:latest}
    container_name: ${COMPOSE_PROJECT_NAME:-rememberme_bot}-init-db
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      BOT_USERNAME: ${BOT_USERNAME:-}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-rememberme}
      DB_ECHO: ${DB_ECHO:-false}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      USER_AUTH_MAX_AGE_SECONDS: ${USER_AUTH_MAX_AGE_SECONDS:-86400}
      WEB_TEST_LOGIN_ENABLED: ${WEB_TEST_LOGIN_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TIMEZONE_DEFAULT: ${TIMEZONE_DEFAULT:-Europe/Moscow}
      APP_VERSION: ${APP_VERSION:-0.1.0-beta}
      APP_RELEASE_CHANNEL: ${APP_RELEASE_CHANNEL:-beta}
      APP_GITHUB_URL: ${APP_GITHUB_URL:-https://github.com/NikitaZhilin/a-new-telegram-bot-with-extensive-functionality}
      APP_CHANGELOG_URL: ${APP_CHANGELOG_URL:-https://github.com/NikitaZhilin/a-new-telegram-bot-with-extensive-functionality/releases}
      STARTUP_UPDATE_MESSAGE: ${STARTUP_UPDATE_MESSAGE:-Обновлена стабильность сервиса и web-версии.}
      STARTUP_UPDATE_MESSAGE_B64: ${STARTUP_UPDATE_MESSAGE_B64:-}
      TESTING_NOTICE_ENABLED: ${TESTING_NOTICE_ENABLED:-true}
      TESTING_NOTICE_TEXT: ${TESTING_NOTICE_TEXT:-}
      WORKER_INTERVAL: ${WORKER_INTERVAL:-60}
      SEND_STARTUP_MENU_ON_BOOT: ${SEND_STARTUP_MENU_ON_BOOT:-true}
      STARTUP_ANNOUNCE_MODE: ${STARTUP_ANNOUNCE_MODE:-off}
      STARTUP_ANNOUNCE_IMPORTANCE: ${STARTUP_ANNOUNCE_IMPORTANCE:-minor}
      DEFAULT_SUBSCRIPTION_PLAN: ${DEFAULT_SUBSCRIPTION_PLAN:-free}
    command: ["python", "-m", "src.main", "init-db"]
    networks:
      - rememberme-network

  # ===========================================================================
  # Telegram Bot (single polling instance)
  # ===========================================================================
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-rememberme_bot-app:latest}
    container_name: ${COMPOSE_PROJECT_NAME:-rememberme_bot}-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      BOT_USERNAME: ${BOT_USERNAME:-}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-rememberme}
      DB_ECHO: ${DB_ECHO:-false}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      USER_AUTH_MAX_AGE_SECONDS: ${USER_AUTH_MAX_AGE_SECONDS:-86400}
      WEB_TEST_LOGIN_ENABLED: ${WEB_TEST_LOGIN_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TIMEZONE_DEFAULT: ${TIMEZONE_DEFAULT:-Europe/Moscow}
      APP_VERSION: ${APP_VERSION:-0.1.0-beta}
      APP_RELEASE_CHANNEL: ${APP_RELEASE_CHANNEL:-beta}
      APP_GITHUB_URL: ${APP_GITHUB_URL:-https://github.com/NikitaZhilin/a-new-telegram-bot-with-extensive-functionality}
      APP_CHANGELOG_URL: ${APP_CHANGELOG_URL:-https://github.com/NikitaZhilin/a-new-telegram-bot-with-extensive-functionality/releases}
      STARTUP_UPDATE_MESSAGE: ${STARTUP_UPDATE_MESSAGE:-Обновлена стабильность сервиса и web-версии.}
      STARTUP_UPDATE_MESSAGE_B64: ${STARTUP_UPDATE_MESSAGE_B64:-}
      TESTING_NOTICE_ENABLED: ${TESTING_NOTICE_ENABLED:-true}
      TESTING_NOTICE_TEXT: ${TESTING_NOTICE_TEXT:-}
      WORKER_INTERVAL: ${WORKER_INTERVAL:-60}
      SEND_STARTUP_MENU_ON_BOOT: ${SEND_STARTUP_MENU_ON_BOOT:-true}
      STARTUP_ANNOUNCE_MODE: ${STARTUP_ANNOUNCE_MODE:-off}
      STARTUP_ANNOUNCE_IMPORTANCE: ${STARTUP_ANNOUNCE_IMPORTANCE:-minor}
      DEFAULT_SUBSCRIPTION_PLAN: ${DEFAULT_SUBSCRIPTION_PLAN:-free}
    command: ["python", "-m", "src.main", "bot"]
    healthcheck:
      disable: true
    networks:
      - rememberme-network
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ===========================================================================
  # FastAPI Admin API
  # ===========================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-rememberme_bot-app:latest}
    container_name: ${COMPOSE_PROJECT_NAME:-rememberme_bot}-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      BOT_USERNAME: ${BOT_USERNAME:-}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-rememberme}
      DB_ECHO: ${DB_ECHO:-false}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      USER_AUTH_MAX_AGE_SECONDS: ${USER_AUTH_MAX_AGE_SECONDS:-86400}
      WEB_TEST_LOGIN_ENABLED: ${WEB_TEST_LOGIN_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TIMEZONE_DEFAULT: ${TIMEZONE_DEFAULT:-Europe/Moscow}
      APP_VERSION: ${APP_VERSION:-0.1.0-beta}
      APP_RELEASE_CHANNEL: ${APP_RELEASE_CHANNEL:-beta}
      APP_GITHUB_URL: ${APP_GITHUB_URL:-https://github.com/NikitaZhilin/a-new-telegram-bot-with-extensive-functionality}
      APP_CHANGELOG_URL: ${APP_CHANGELOG_URL:-https://github.com/NikitaZhilin/a-new-telegram-bot-with-extensive-functionality/releases}
      STARTUP_UPDATE_MESSAGE: ${STARTUP_UPDATE_MESSAGE:-Обновлена стабильность сервиса и web-версии.}
      STARTUP_UPDATE_MESSAGE_B64: ${STARTUP_UPDATE_MESSAGE_B64:-}
      TESTING_NOTICE_ENABLED: ${TESTING_NOTICE_ENABLED:-true}
      TESTING_NOTICE_TEXT: ${TESTING_NOTICE_TEXT:-}
      WORKER_INTERVAL: ${WORKER_INTERVAL:-60}
      SEND_STARTUP_MENU_ON_BOOT: ${SEND_STARTUP_MENU_ON_BOOT:-true}
      STARTUP_ANNOUNCE_MODE: ${STARTUP_ANNOUNCE_MODE:-off}
      STARTUP_ANNOUNCE_IMPORTANCE: ${STARTUP_ANNOUNCE_IMPORTANCE:-minor}
      DEFAULT_SUBSCRIPTION_PLAN: ${DEFAULT_SUBSCRIPTION_PLAN:-free}
    command: ["python", "-m", "src.main", "api"]
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - rememberme-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ===========================================================================
  # Reminder Worker (SINGLE INSTANCE ONLY)
  # ===========================================================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: ${WORKER_IMAGE:-rememberme_bot-worker:latest}
    container_name: ${COMPOSE_PROJECT_NAME:-rememberme_bot}-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      BOT_USERNAME: ${BOT_USERNAME:-}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-rememberme}
      DB_ECHO: ${DB_ECHO:-false}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      USER_AUTH_MAX_AGE_SECONDS: ${USER_AUTH_MAX_AGE_SECONDS:-86400}
      WEB_TEST_LOGIN_ENABLED: ${WEB_TEST_LOGIN_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TIMEZONE_DEFAULT: ${TIMEZONE_DEFAULT:-Europe/Moscow}
      APP_VERSION: ${APP_VERSION:-0.1.0-beta}
      APP_RELEASE_CHANNEL: ${APP_RELEASE_CHANNEL:-beta}
      APP_GITHUB_URL: ${APP_GITHUB_URL:-https://github.com/NikitaZhilin/a-new-telegram-bot-with-extensive-functionality}
      APP_CHANGELOG_URL: ${APP_CHANGELOG_URL:-https://github.com/NikitaZhilin/a-new-telegram-bot-with-extensive-functionality/releases}
      STARTUP_UPDATE_MESSAGE: ${STARTUP_UPDATE_MESSAGE:-Обновлена стабильность сервиса и web-версии.}
      STARTUP_UPDATE_MESSAGE_B64: ${STARTUP_UPDATE_MESSAGE_B64:-}
      TESTING_NOTICE_ENABLED: ${TESTING_NOTICE_ENABLED:-true}
      TESTING_NOTICE_TEXT: ${TESTING_NOTICE_TEXT:-}
      WORKER_INTERVAL: ${WORKER_INTERVAL:-60}
      SEND_STARTUP_MENU_ON_BOOT: ${SEND_STARTUP_MENU_ON_BOOT:-true}
      STARTUP_ANNOUNCE_MODE: ${STARTUP_ANNOUNCE_MODE:-off}
      STARTUP_ANNOUNCE_IMPORTANCE: ${STARTUP_ANNOUNCE_IMPORTANCE:-minor}
      DEFAULT_SUBSCRIPTION_PLAN: ${DEFAULT_SUBSCRIPTION_PLAN:-free}
    command: ["python", "-m", "src.main", "worker"]
    healthcheck:
      disable: true
    networks:
      - rememberme-network
    # IMPORTANT: DO NOT SCALE - single instance only!
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

# ===========================================================================
# Volumes
# ===========================================================================
volumes:
  postgres_data:
    driver: local
    name: ${COMPOSE_PROJECT_NAME:-rememberme_bot}_postgres_data

# ===========================================================================
# Networks
# ===========================================================================
networks:
  rememberme-network:
    driver: bridge
