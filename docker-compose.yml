# Docker Compose for local development.
#
# Services:
# - postgres: PostgreSQL database
# - bot: Telegram bot (scalable)
# - api: FastAPI admin API
# - worker: Reminder worker (single instance)
#
# Usage:
#   docker-compose up -d           # Start all services
#   docker-compose up -d bot       # Start only bot
#   docker-compose logs -f bot     # Follow bot logs
#   docker-compose down            # Stop all services

services:
  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: rememberme-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rememberme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rememberme-network

  # ===========================================================================
  # Telegram Bot (scalable)
  # ===========================================================================
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rememberme-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-rememberme}
      DB_ECHO: ${DB_ECHO:-false}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TIMEZONE_DEFAULT: ${TIMEZONE_DEFAULT:-Europe/Moscow}
      WORKER_INTERVAL: ${WORKER_INTERVAL:-60}
    command: ["python", "-m", "src.main", "bot"]
    networks:
      - rememberme-network
    # Scale with: docker-compose up -d --scale bot=3
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ===========================================================================
  # FastAPI Admin API
  # ===========================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rememberme-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-rememberme}
      DB_ECHO: ${DB_ECHO:-false}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TIMEZONE_DEFAULT: ${TIMEZONE_DEFAULT:-Europe/Moscow}
      WORKER_INTERVAL: ${WORKER_INTERVAL:-60}
    command: ["python", "-m", "src.main", "api"]
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - rememberme-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ===========================================================================
  # Reminder Worker (SINGLE INSTANCE ONLY)
  # ===========================================================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: rememberme-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-rememberme}
      DB_ECHO: ${DB_ECHO:-false}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TIMEZONE_DEFAULT: ${TIMEZONE_DEFAULT:-Europe/Moscow}
      WORKER_INTERVAL: ${WORKER_INTERVAL:-60}
    command: ["python", "-m", "src.main", "worker"]
    networks:
      - rememberme-network
    # IMPORTANT: DO NOT SCALE - single instance only!
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

# ===========================================================================
# Volumes
# ===========================================================================
volumes:
  postgres_data:
    driver: local

# ===========================================================================
# Networks
# ===========================================================================
networks:
  rememberme-network:
    driver: bridge
