name: Server health

# Read-only report about the VPS: containers, memory, disk, errors, backups.
# Results are shown as annotations on the run page.
on:
  workflow_dispatch:
  push:
    branches:
      - ops/health-check
  schedule:
    - cron: "17 5 * * *"

jobs:
  health:
    runs-on: ubuntu-latest
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER || vars.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/bots/rememberme' }}
      COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME || 'rememberme_bot' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Server health report
        run: |
          set +e
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "PROJECT_DIR='$DEPLOY_PATH' COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME' bash -s" < scripts/server-health.sh > health.txt 2>&1
          status=$?
          cat health.txt
          grep '^WARN:' health.txt | head -9 | while IFS= read -r l; do echo "::warning title=Server health::${l#WARN: }"; done
          report=$(grep -v '^WARN:' health.txt | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::notice title=Server health::${report}"
          exit $status

      - name: Post-deploy checks and test backup to Telegram
        if: always()
        run: |
          set +e
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" bash -s > live.txt 2>&1 <<'REMOTE'
          P=rememberme_bot
          cd /opt/bots/rememberme && git log --oneline -1 | cut -c1-60
          echo "== alembic: $(docker exec $P-postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT version_num FROM alembic_version"')"
          echo "== bot log"; docker logs $P-bot 2>&1 | grep -oE '"event": ?"[^"]{0,70}"|^[A-Z][^{]{0,70}' | sed -E 's/[0-9]{5,}/<id>/g' | tail -n 8
          echo "== worker log"; docker logs $P-worker 2>&1 | grep -iE 'started|resumed|summar|error' | sed -E 's/[0-9]{5,}/<id>/g' | tail -n 5 | cut -c1-160
          echo "== test backup to Telegram"
          FORCE_TELEGRAM_BACKUP=1 PROJECT_DIR=/opt/bots/rememberme bash /opt/bots/rememberme/scripts/backup-vps.sh 2>&1 | sed -E 's#/opt/bots/rememberme/backups/##' | tail -n 3
          echo "== error journal (last 3)"
          docker exec $P-postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA -F " | " -c "SELECT id, section, error_type, location, count, to_char(last_seen_at, '"'"'DD.MM HH24:MI'"'"') FROM error_events ORDER BY last_seen_at DESC LIMIT 3"'
          REMOTE
          cat live.txt
          report=$(cut -c1-250 live.txt | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::notice title=Users::${report}"
