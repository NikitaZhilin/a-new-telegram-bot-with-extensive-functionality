name: Server health

# Read-only report about the VPS: containers, memory, disk, errors, backups.
# Results are shown as annotations on the run page.
on:
  workflow_dispatch:
  push:
    branches:
      - ops/health-check
  schedule:
    - cron: "17 5 * * *"

jobs:
  health:
    runs-on: ubuntu-latest
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER || vars.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/bots/rememberme' }}
      COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME || 'rememberme_bot' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Server health report
        run: |
          set +e
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "PROJECT_DIR='$DEPLOY_PATH' COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME' bash -s" < scripts/server-health.sh > health.txt 2>&1
          status=$?
          cat health.txt
          grep '^WARN:' health.txt | head -9 | while IFS= read -r l; do echo "::warning title=Server health::${l#WARN: }"; done
          report=$(grep -v '^WARN:' health.txt | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::notice title=Server health::${report}"
          exit $status

      - name: Medication marks around 17:28 MSK (anonymous)
        if: always()
        run: |
          set +e
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" bash -s > live.txt 2>&1 <<'REMOTE'
          P=rememberme_bot
          q() { docker exec $P-postgres sh -c "psql -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -tA -F ' | ' -c \"$1\""; }
          echo "== intakes 16.10 13:30-15:00 UTC (med id, status, slot, marked, created)"
          q "SELECT medication_id, status, to_char(scheduled_slot_at_utc,'HH24:MI'), to_char(taken_at_utc,'HH24:MI:SS') FROM medication_intakes WHERE taken_at_utc BETWEEN '2026-10-16 13:30+00' AND '2026-10-16 15:00+00' ORDER BY taken_at_utc"
          echo "== bot events 16.10 14:00-14:45 UTC (medication/reminders)"
          q "SELECT to_char(created_at,'HH24:MI:SS'), event_type, event_name, domain FROM bot_activity_events WHERE created_at BETWEEN '2026-10-16 14:00+00' AND '2026-10-16 14:45+00' ORDER BY created_at LIMIT 60"
          echo "== sent med notifications 16.10 11:00-14:45 UTC (med id, slot, sent)"
          q "SELECT r.medication_id, to_char(r.remind_at_utc,'HH24:MI'), r.repeat_rule, to_char(n.sent_at_utc,'HH24:MI:SS'), n.status FROM reminder_notifications n JOIN reminders r ON r.id=n.reminder_id WHERE r.medication_id IS NOT NULL AND n.sent_at_utc BETWEEN '2026-10-16 11:00+00' AND '2026-10-16 14:45+00' ORDER BY n.sent_at_utc"
          echo "== schedules (med id, local-agnostic UTC times, importance) of meds marked above"
          q "SELECT r.medication_id, string_agg(to_char(r.remind_at_utc,'HH24:MI'), ',' ORDER BY r.remind_at_utc), r.repeat_rule FROM reminders r WHERE r.status='ACTIVE' AND r.medication_id IN (SELECT medication_id FROM medication_intakes WHERE taken_at_utc BETWEEN '2026-10-16 13:30+00' AND '2026-10-16 15:00+00') GROUP BY r.medication_id, r.repeat_rule"
          echo "== error 4 message (digits masked)"
          q "SELECT regexp_replace(left(message, 200), '[0-9]{4,}', '<n>', 'g') FROM error_events WHERE id IN (2,4)"
          echo "== error journal"
          q "SELECT id, service, section, error_type, location, count, to_char(last_seen_at,'DD.MM HH24:MI') FROM error_events ORDER BY last_seen_at DESC LIMIT 10"
          REMOTE
          cat live.txt
          report=$(cut -c1-250 live.txt | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::notice title=Users::${report}"
