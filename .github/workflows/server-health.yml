name: Server health

# Read-only report about the VPS: containers, memory, disk, errors, backups.
# Results are shown as annotations on the run page.
on:
  workflow_dispatch:
  push:
    branches:
      - ops/health-check
  schedule:
    - cron: "17 5 * * *"

jobs:
  health:
    runs-on: ubuntu-latest
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER || vars.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/bots/rememberme' }}
      COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME || 'rememberme_bot' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Server health report
        run: |
          set +e
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "PROJECT_DIR='$DEPLOY_PATH' COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME' bash -s" < scripts/server-health.sh > health.txt 2>&1
          status=$?
          cat health.txt
          grep '^WARN:' health.txt | head -9 | while IFS= read -r l; do echo "::warning title=Server health::${l#WARN: }"; done
          report=$(grep -v '^WARN:' health.txt | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::notice title=Server health::${report}"
          exit $status

      - name: Post-deploy check, test alert, resolve fixed journal entries
        if: always()
        run: |
          set +e
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" bash -s > live.txt 2>&1 <<'REMOTE'
          P=rememberme_bot
          q() { docker exec $P-postgres sh -c "psql -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -tA -F ' | ' -c \"$1\""; }
          echo "== version: $(cd /opt/bots/rememberme && git log --oneline -1 | cut -c1-50)"
          echo "== errors since deploy"; q "SELECT id, section, error_type, location FROM error_events WHERE last_seen_at > now() - interval '15 minutes'"
          echo "== mark fixed journal entries resolved (menu exit crash; blocked user logged as error)"
          q "UPDATE error_events SET resolved_at = now() WHERE resolved_at IS NULL AND (location LIKE '%conversation_exit.py:50%' OR location LIKE '%reminder_worker.py:489%') RETURNING id"
          echo "== test alert to admins"
          docker exec -u 0 -i -e ALERT_TEXT="✅ Проверка: так будут выглядеть уведомления о проблемах на сервере. Сейчас всё в порядке, это тест." $P-bot python - < /opt/bots/rememberme/scripts/notify-admins.py
          REMOTE
          cat live.txt
          report=$(cut -c1-250 live.txt | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::notice title=Users::${report}"
