name: CI and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rememberme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BOT_TOKEN: "1234567890:TEST_TOKEN_FOR_CI_ONLY"
      BOT_USERNAME: "rememberme_test_bot"
      ADMIN_TOKEN: "ci-admin-token"
      ADMIN_TELEGRAM_IDS: "1"
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/rememberme"
      API_DOCS_ENABLED: "false"
      CORS_ORIGINS: ""
      SEND_STARTUP_MENU_ON_BOOT: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: python -B -m pytest -p no:cacheprovider tests
      - name: Initialize database
        run: python -B -m src.main init-db
      - name: Dry-run API
        run: python -B -m src.main api --dry-run
      - name: Dry-run bot
        run: python -B -m src.main bot --dry-run
      - name: Dry-run worker
        run: python -B -m src.main worker --dry-run
      - name: Dry-run all
        run: python -B -m src.main all --dry-run

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Deploy on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PROJECT_DIR: ${{ secrets.VPS_PROJECT_DIR }}
        run: |
          PROJECT_DIR="${VPS_PROJECT_DIR:-/opt/bots/rememberme}"
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" "cd '$PROJECT_DIR' && bash deploy-vps-manual.sh"
