name: Test and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rememberme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BOT_TOKEN: "1234567890:TEST_TOKEN_FOR_CI_ONLY"
      BOT_USERNAME: "rememberme_test_bot"
      ADMIN_TOKEN: "ci-admin-token"
      ADMIN_TELEGRAM_IDS: "1"
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/rememberme"
      API_DOCS_ENABLED: "false"
      CORS_ORIGINS: ""
      SEND_STARTUP_MENU_ON_BOOT: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize database
        run: python -B -m src.main init-db

      - name: Dry-run API
        run: python -B -m src.main api --dry-run

      - name: Dry-run bot
        run: python -B -m src.main bot --dry-run

      - name: Dry-run worker
        run: python -B -m src.main worker --dry-run

      - name: Dry-run all
        run: python -B -m src.main all --dry-run

      - name: Run tests
        run: python -B -m pytest -p no:cacheprovider tests

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER || vars.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/bots/rememberme' }}
      REPO_URL: ${{ vars.REPO_URL || format('{0}/{1}.git', github.server_url, github.repository) }}
      BRANCH: main
      COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME || 'rememberme_bot' }}
      APP_IMAGE: ${{ vars.APP_IMAGE || 'rememberme_bot-app:latest' }}
      WORKER_IMAGE: ${{ vars.WORKER_IMAGE || 'rememberme_bot-worker:latest' }}
      POSTGRES_USER: ${{ vars.POSTGRES_USER || 'postgres' }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB || 'rememberme' }}
      POSTGRES_PORT: ${{ vars.POSTGRES_PORT || '5432' }}
      POSTGRES_BIND_HOST: ${{ vars.POSTGRES_BIND_HOST || '127.0.0.1' }}
      API_BIND_HOST: ${{ vars.API_BIND_HOST || '127.0.0.1' }}
      API_PORT: ${{ vars.API_PORT || '8000' }}
      API_DOCS_ENABLED: ${{ vars.API_DOCS_ENABLED || 'false' }}
      CORS_ORIGINS: ${{ vars.CORS_ORIGINS || '' }}
      BOT_USERNAME: ${{ vars.BOT_USERNAME || '' }}
      ADMIN_TELEGRAM_IDS: ${{ vars.ADMIN_TELEGRAM_IDS || '' }}
      WEB_PUBLIC_URL: ${{ vars.WEB_PUBLIC_URL || '' }}
      WEB_TEST_LOGIN_ENABLED: ${{ vars.WEB_TEST_LOGIN_ENABLED || 'false' }}
      WEB_LOGIN_TOKEN_TTL_DAYS: ${{ vars.WEB_LOGIN_TOKEN_TTL_DAYS || '30' }}
      LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}
      TIMEZONE_DEFAULT: ${{ vars.TIMEZONE_DEFAULT || 'Europe/Moscow' }}
      APP_VERSION: ${{ vars.APP_VERSION || format('0.1.{0}-beta', github.run_number) }}
      STARTUP_UPDATE_MESSAGE: "${{ vars.STARTUP_UPDATE_MESSAGE || 'Обновлена стабильность сервиса и web-версии.' }}"
      TESTING_NOTICE_ENABLED: ${{ vars.TESTING_NOTICE_ENABLED || 'true' }}
      TESTING_NOTICE_TEXT: ${{ vars.TESTING_NOTICE_TEXT || '⚠️ Бот находится в тестировании. Данные могут быть изменены или утеряны.' }}
      SEND_STARTUP_MENU_ON_BOOT: ${{ vars.SEND_STARTUP_MENU_ON_BOOT || 'true' }}
      DEFAULT_SUBSCRIPTION_PLAN: ${{ vars.DEFAULT_SUBSCRIPTION_PLAN || 'free' }}
      WORKER_INTERVAL: ${{ vars.WORKER_INTERVAL || '60' }}
    steps:
      - name: Check deployment secrets
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing required deployment value: $name" >&2
              missing=1
            fi
          done
          if [ -z "$BOT_TOKEN" ] || [ -z "$ADMIN_TOKEN" ] || [ -z "$POSTGRES_PASSWORD" ]; then
            echo "BOT_TOKEN, ADMIN_TOKEN, or POSTGRES_PASSWORD is not configured in GitHub Secrets."
            echo "Deploy will reuse the existing .env file on the VPS and copy it to .env.prod."
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Deployment cannot start. Configure the missing GitHub Secrets or Variables first." >&2
            exit 1
          fi

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Update project on VPS
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' REPO_URL='$REPO_URL' BRANCH='$BRANCH' bash -s" <<'REMOTE'
          set -euo pipefail
          if [ -z "$DEPLOY_PATH" ] || [ "$DEPLOY_PATH" = "/" ] || [ "$DEPLOY_PATH" = "/opt" ]; then
            echo "Refusing unsafe DEPLOY_PATH: $DEPLOY_PATH" >&2
            exit 1
          fi
          command -v git >/dev/null 2>&1 || { echo "git is required on the VPS." >&2; exit 1; }
          command -v docker >/dev/null 2>&1 || { echo "Docker is required on the VPS." >&2; exit 1; }

          if [ -d "$DEPLOY_PATH/.git" ]; then
            git -C "$DEPLOY_PATH" fetch origin "$BRANCH"
            git -C "$DEPLOY_PATH" checkout "$BRANCH"
            git -C "$DEPLOY_PATH" reset --hard "origin/$BRANCH"
          else
            mkdir -p "$(dirname "$DEPLOY_PATH")"
            git clone --branch "$BRANCH" "$REPO_URL" "$DEPLOY_PATH"
          fi

          mkdir -p "$DEPLOY_PATH/logs" "$DEPLOY_PATH/backups"
          REMOTE

      - name: Upload production environment
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$ADMIN_TOKEN" ] || [ -z "$POSTGRES_PASSWORD" ]; then
            umask 077
            {
              printf 'COMPOSE_PROJECT_NAME=%s\n' "$COMPOSE_PROJECT_NAME"
              printf 'APP_IMAGE=%s\n' "$APP_IMAGE"
              printf 'WORKER_IMAGE=%s\n' "$WORKER_IMAGE"
              printf 'APP_VERSION=%s\n' "$APP_VERSION"
              printf 'STARTUP_UPDATE_MESSAGE=%s\n' "$STARTUP_UPDATE_MESSAGE"
              printf 'TESTING_NOTICE_ENABLED=%s\n' "$TESTING_NOTICE_ENABLED"
              printf 'TESTING_NOTICE_TEXT=%s\n' "$TESTING_NOTICE_TEXT"
              printf 'SEND_STARTUP_MENU_ON_BOOT=%s\n' "$SEND_STARTUP_MENU_ON_BOOT"
            } > .env.prod.overrides
            scp -i ~/.ssh/deploy_key -P "$VPS_PORT" .env.prod.overrides "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/.env.prod.overrides"
            rm -f .env.prod.overrides
            ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "
              set -e
              if [ ! -s '$DEPLOY_PATH/.env' ]; then
                echo 'Missing app secrets in GitHub and $DEPLOY_PATH/.env does not exist on VPS.' >&2
                exit 1
              fi
              cp '$DEPLOY_PATH/.env' '$DEPLOY_PATH/.env.prod'
              while IFS= read -r line; do
                key=\"\${line%%=*}\"
                grep -v \"^\${key}=\" '$DEPLOY_PATH/.env.prod' > '$DEPLOY_PATH/.env.prod.tmp' || true
                printf '%s\n' \"\$line\" >> '$DEPLOY_PATH/.env.prod.tmp'
                mv '$DEPLOY_PATH/.env.prod.tmp' '$DEPLOY_PATH/.env.prod'
              done < '$DEPLOY_PATH/.env.prod.overrides'
              rm -f '$DEPLOY_PATH/.env.prod.overrides'
              chmod 600 '$DEPLOY_PATH/.env.prod'
            "
            exit 0
          fi
          umask 077
          {
            printf 'COMPOSE_PROJECT_NAME=%s\n' "$COMPOSE_PROJECT_NAME"
            printf 'APP_IMAGE=%s\n' "$APP_IMAGE"
            printf 'WORKER_IMAGE=%s\n' "$WORKER_IMAGE"
            printf 'BOT_TOKEN=%s\n' "$BOT_TOKEN"
            printf 'BOT_USERNAME=%s\n' "$BOT_USERNAME"
            printf 'POSTGRES_USER=%s\n' "$POSTGRES_USER"
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'POSTGRES_DB=%s\n' "$POSTGRES_DB"
            printf 'POSTGRES_PORT=%s\n' "$POSTGRES_PORT"
            printf 'POSTGRES_BIND_HOST=%s\n' "$POSTGRES_BIND_HOST"
            printf 'DB_ECHO=false\n'
            printf 'ADMIN_TOKEN=%s\n' "$ADMIN_TOKEN"
            printf 'ADMIN_TELEGRAM_IDS=%s\n' "$ADMIN_TELEGRAM_IDS"
            printf 'API_HOST=0.0.0.0\n'
            printf 'API_PORT=%s\n' "$API_PORT"
            printf 'API_BIND_HOST=%s\n' "$API_BIND_HOST"
            printf 'API_DOCS_ENABLED=%s\n' "$API_DOCS_ENABLED"
            printf 'CORS_ORIGINS=%s\n' "$CORS_ORIGINS"
            printf 'USER_AUTH_MAX_AGE_SECONDS=86400\n'
            printf 'WEB_TEST_LOGIN_ENABLED=%s\n' "$WEB_TEST_LOGIN_ENABLED"
            printf 'WEB_PUBLIC_URL=%s\n' "$WEB_PUBLIC_URL"
            printf 'WEB_LOGIN_TOKEN_TTL_DAYS=%s\n' "$WEB_LOGIN_TOKEN_TTL_DAYS"
            printf 'LOG_LEVEL=%s\n' "$LOG_LEVEL"
            printf 'TIMEZONE_DEFAULT=%s\n' "$TIMEZONE_DEFAULT"
            printf 'APP_VERSION=%s\n' "$APP_VERSION"
            printf 'STARTUP_UPDATE_MESSAGE=%s\n' "$STARTUP_UPDATE_MESSAGE"
            printf 'TESTING_NOTICE_ENABLED=%s\n' "$TESTING_NOTICE_ENABLED"
            printf 'TESTING_NOTICE_TEXT=%s\n' "$TESTING_NOTICE_TEXT"
            printf 'SEND_STARTUP_MENU_ON_BOOT=%s\n' "$SEND_STARTUP_MENU_ON_BOOT"
            printf 'DEFAULT_SUBSCRIPTION_PLAN=%s\n' "$DEFAULT_SUBSCRIPTION_PLAN"
            printf 'WORKER_INTERVAL=%s\n' "$WORKER_INTERVAL"
          } > .env.prod.deploy
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" .env.prod.deploy "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/.env.prod"
          rm -f .env.prod.deploy
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "chmod 600 '$DEPLOY_PATH/.env.prod'"

      - name: Build, migrate, and restart services
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME' APP_IMAGE='$APP_IMAGE' WORKER_IMAGE='$WORKER_IMAGE' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          if docker compose version >/dev/null 2>&1; then
            COMPOSE="docker compose --env-file .env.prod -p $COMPOSE_PROJECT_NAME"
            $COMPOSE build bot api worker init-db
            $COMPOSE up -d postgres
            $COMPOSE rm -f -s init-db >/dev/null 2>&1 || true
            $COMPOSE run --rm init-db
            $COMPOSE up -d --no-deps bot api worker
            $COMPOSE ps
            $COMPOSE logs --tail=80 bot api worker
          else
            echo "Docker Compose plugin is not available; using deploy-vps-manual.sh fallback."
            ENV_FILE=.env.prod \
            PROJECT_RESOURCE_PREFIX=rememberme_bot \
            PROJECT_DIR="$DEPLOY_PATH" \
            APP_IMAGE="$APP_IMAGE" \
            WORKER_IMAGE="$WORKER_IMAGE" \
            bash deploy-vps-manual.sh
          fi
          REMOTE
